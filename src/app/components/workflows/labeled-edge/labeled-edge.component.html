<ng-diagram-base-edge [edge]="edge()" targetArrowhead="arrowclosed">
    @if (labelText()) {
    <ng-diagram-base-edge-label [id]="labelId()" [positionOnEdge]="0.5">
        <div class="edge-label">
            {{ labelText() }}
        </div>
    </ng-diagram-base-edge-label>
    }
</ng-diagram-base-edge>
