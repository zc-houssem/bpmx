<div class="flex flex-col lg:flex-row flex-1 w-full h-full overflow-hidden">
  <hlm-resizable-group class="h-full w-full rounded-lg border">
    <hlm-resizable-panel [minSize]="40">
      <ng-diagram class="flex-1" [model]="model" [config]="config" [edgeTemplateMap]="edgeTemplateMap"
        (selectionChanged)="onSelectionChanged($event)" (edgeDrawn)="onEdgeDrawn($event)" />
    </hlm-resizable-panel>
    <hlm-resizable-handle />
    <hlm-resizable-panel [minSize]="30" class="overflow-hidden!">
      <div class="relative h-full w-full">
        <div class="absolute inset-0 overflow-y-auto pb-4 pr-1">
          <div hlmAccordion type="multiple" class="w-full">
            <!-- Workflow Configuration Section -->
            <div hlmAccordionItem class="px-4">
              <h3>
                <button hlmAccordionTrigger>
                  <div class="flex items-center justify-center gap-2">
                    <ng-icon hlmAccordionIcon name="lucideSettings" />
                    <span>Workflow Configuration</span>
                  </div>
                  <ng-icon hlmAccordionIcon name="lucideChevronDown" />
                </button>
              </h3>
              <hlm-accordion-content class="px-1">
                <app-form-builder [formObject]="globalActionsFormObject"></app-form-builder>
              </hlm-accordion-content>
            </div>

            <!-- Properties Section -->
            <div hlmAccordionItem class="px-4" [isOpened]="true">
              <h3>
                <button hlmAccordionTrigger>
                  <div class="flex items-center justify-center gap-2">
                    <ng-icon hlmAccordionIcon name="lucideFileText" />
                    <span>Properties</span>
                  </div>
                  <ng-icon hlmAccordionIcon name="lucideChevronDown" />
                </button>
              </h3>
              <hlm-accordion-content class="data-[state=open]:h-auto! px-1">
                @if (selectedNodeId) {
                <app-node-form [nodeId]="selectedNodeId" [nodeData]="selectedNodeData" (save)="onNodeUpdate($event)"
                  (delete)="onNodeDelete($event)">
                </app-node-form>
                } @else if (selectedEdgeId) {
                <app-edge-form [edgeId]="selectedEdgeId" [edgeData]="selectedEdgeData"
                  [availableNodes]="getAvailableNodes()" (save)="onEdgeUpdate($event)" (delete)="onEdgeDelete($event)">
                </app-edge-form>
                } @else {
                <div class="flex items-center justify-center py-4 text-muted-foreground">
                  <span>Select a node or edge to edit</span>
                </div>
                }
              </hlm-accordion-content>
            </div>

            <!-- Actions Section -->
            <div hlmAccordionItem class="px-4">
              <h3>
                <button hlmAccordionTrigger>
                  <div class="flex items-center justify-center gap-2">
                    <ng-icon hlmAccordionIcon name="lucideZap" />
                    <span>Actions</span>
                  </div>
                  <ng-icon hlmAccordionIcon name="lucideChevronDown" />
                </button>
              </h3>
              <hlm-accordion-content>
                <div class="flex flex-col gap-4">
                  <!-- Diagram Controls Section -->
                  <div>
                    <p class="text-sm font-semibold text-foreground mb-2">Diagram Controls</p>
                    <div class="flex flex-row gap-2">
                      <button hlmBtn class="flex-1" (click)="addNode()">New Node</button>
                      <button hlmBtn class="flex-1" variant="secondary" (click)="centerView()">Center View</button>
                    </div>
                  </div>

                  <!-- Divider -->
                  <div class="border-t"></div>

                  <!-- Actions Section -->
                  <div>
                    <p class="text-sm font-semibold text-foreground mb-2">Workflow Actions</p>
                    <div class="flex flex-col gap-2">
                      <div class="flex flex-row gap-2">
                        <button hlmBtn class="flex-1" variant="outline" (click)="onExportWorkflow()">
                          Export JSON
                        </button>
                        <button hlmBtn class="flex-1" variant="outline" (click)="onImport()">
                          Import JSON
                        </button>
                      </div>
                      <div class="flex flex-row gap-2">
                        <button hlmBtn class="flex-1" variant="outline" (click)="onSaveToDatabase()">
                          Save to DB
                        </button>
                        <button hlmBtn class="flex-1" variant="outline" (click)="onLoadFromDatabase()">
                          Load from DB
                        </button>
                      </div>
                      <button hlmBtn variant="destructive" (click)="onClearWorkflow()">
                        Clear Workflow
                      </button>
                    </div>
                  </div>
                </div>
              </hlm-accordion-content>
            </div>
          </div>
        </div>
      </div>
    </hlm-resizable-panel>
  </hlm-resizable-group>
</div>
