<div class="flex flex-col lg:flex-row flex-1 w-full overflow-auto">
  <hlm-resizable-group class="h-full w-full rounded-lg border">
    <hlm-resizable-panel [minSize]="40">
      <ng-diagram class="flex-1" [model]="model" [config]="config" />
    </hlm-resizable-panel>
    <hlm-resizable-handle />
    <hlm-resizable-panel [minSize]="20">
      <hlm-resizable-group direction="vertical">
        <hlm-resizable-panel [minSize]="20">
          <div class="h-full overflow-auto p-4">
            <app-workflow-controls [addNode]="addNode.bind(this)"
              [centerView]="centerView.bind(this)"></app-workflow-controls>
          </div>
        </hlm-resizable-panel>
        <hlm-resizable-handle />
        <hlm-resizable-panel [minSize]="10">
          <div class="flex h-full items-center justify-center p-6">
            <span class="font-semibold">Three</span>
          </div>
        </hlm-resizable-panel>
      </hlm-resizable-group>
    </hlm-resizable-panel>
  </hlm-resizable-group>
</div>
