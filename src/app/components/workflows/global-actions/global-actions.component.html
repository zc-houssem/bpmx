<div class="flex flex-col h-full p-4">
    <h2 class="text-md font-semibold mb-3">Workflow Configuration</h2>

    <app-form-builder class="flex flex-col flex-1" [formObject]="formObject"></app-form-builder>

    <div class="flex flex-col gap-2 mt-4">
        <h3 class="text-sm font-medium mb-1">Diagram Controls</h3>
        <div class="flex flex-row gap-2">
            <button hlmBtn class="flex-1" (click)="addNode()">New Node</button>
            <button hlmBtn class="flex-1" variant="secondary" (click)="centerView()">Center View</button>
        </div>
    </div>

    <div class="flex flex-col gap-2 mt-4">
        <h3 class="text-sm font-medium mb-1">Actions</h3>
        <div class="flex flex-row gap-2">
            <button hlmBtn class="flex-1" variant="outline" (click)="onExport()">
                Export JSON
            </button>
            <button hlmBtn class="flex-1" variant="outline" (click)="onImport()">
                Import JSON
            </button>
        </div>
        <button hlmBtn variant="destructive" (click)="onClear()">
            Clear Workflow
        </button>
    </div>
</div>
